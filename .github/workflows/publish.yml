# Nightly refresh: pull the public road work layers, rebuild the map, publish it as a static site.
# The database exists only for the length of this job.
name: Refresh and publish

on:
  schedule:
    - cron: "17 9 * * *"        # 2:17 am in Tucson (Arizona stays on UTC-7 all year)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: roadwork
          POSTGRES_PASSWORD: roadwork
          POSTGRES_DB: roadwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadwork"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://roadwork:roadwork@localhost:5432/roadwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_normalize.py
      - name: Pull, match and build tiles
        run: python -m pipeline.run
      - name: Checks that must hold on every refresh
        run: python -m pytest -q tests/test_acceptance.py -k "count or links or cost or apart or non_paving or 404"
      - name: Build the static site
        run: python -m pipeline.export --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
